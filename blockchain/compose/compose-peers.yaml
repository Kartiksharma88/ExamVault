      - ../organizations/peerOrganizations/university.examvault.local/peers/peer0.university.examvault.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/university.examvault.local/peers/peer0.university.examvault.local/tls:/etc/hyperledger/fabric/tls
    ports:
      - 8051:8051
      - 18051:18051
    container_name: peer0.university.examvault.local
    networks:

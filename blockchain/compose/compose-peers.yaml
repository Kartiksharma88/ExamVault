      - ../organizations/peerOrganizations/auditor.examvault.local/peers/peer0.auditor.examvault.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/auditor.examvault.local/peers/peer0.auditor.examvault.local/tls:/etc/hyperledger/fabric/tls
